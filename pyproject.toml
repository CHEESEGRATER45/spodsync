[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spodsync"
version = "0.1.0"
description = "Scan local MP3s and fetch matching synced lyrics (.lrc) from lrclib.net"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Rafi" }
]
dependencies = [
    "mutagen>=1.47",
    "requests>=2.31",
]

[project.scripts]
spodsync-launch = "spodsync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
